name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  binaries:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Tidy
        working-directory: agent
        run: go mod tidy
      - name: Test
        working-directory: agent
        run: go test ./...
      - name: Build
        working-directory: agent
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          EXT=""
          if [ "$GOOS" = "windows" ]; then EXT=".exe"; fi
          go build -trimpath -ldflags "-s -w" -o "../dist/cloudloom-agent-${{ matrix.goos }}-${{ matrix.goarch }}${EXT}" ./cmd/agent
      - uses: actions/upload-artifact@v4
        with:
          name: cloudloom-agent-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/

  publish:
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/* --title "CloudLoom agent $TAG" --notes "Read-only discovery agents. See README for usage."
